name: ArenaMobile
options:
  bundleIdPrefix: com.arenaofthelords
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  ArenaMobile:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen:
          UIImageName: Logo
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arenaofthelords.mobile
        PRODUCT_NAME: ArenaMobile
        # Bumped per an explicit request ("поменять и версии для ios") after this round's
        # fixes — resource-badge redesign to match the web app, the construction-stuck-after-
        # finishing bug, and the village-map zoom scaling bug. MARKETING_VERSION is the
        # user-facing version (App Store "Version"); CURRENT_PROJECT_VERSION is the build
        # number and must strictly increase on every submitted build, even within the same
        # marketing version — bump it on every release, not just ones that also bump
        # MARKETING_VERSION.
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # No signing config here on purpose — the GitHub Actions build overrides these with
        # CODE_SIGNING_ALLOWED=NO so it can produce an .ipa with no Apple Developer account at
        # all. Sideloadly (on Windows) does the actual signing later, using your free Apple ID.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
