name: Build unsigned iOS IPA

# Builds the app with NO Apple Developer account and NO code signing at all — the whole point
# is to produce a .ipa that Sideloadly (running on your Windows PC) can sign locally with your
# free Apple ID and push straight to your iPhone over USB. See README.md for the full flow.
on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build:
    # macos-15's default Xcode is newer than macos-14's, which matters here: XcodeGen always
    # writes the .xcodeproj in the format of whatever Xcode is current when the XcodeGen release
    # you get from Homebrew was built. If that format is newer than the Xcode actually used to
    # build, xcodebuild refuses to even open the project ("future Xcode project file format").
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode actually installed on this runner
        # Belt-and-suspenders on top of picking macos-15 above: GitHub's runner images ship
        # several Xcode versions side by side, and xcode-select's default can lag behind the
        # newest one — which is exactly how this broke the first time (XcodeGen's project
        # format was newer than the default-selected Xcode 15.4). Always pinning to the newest
        # available one keeps this working even if GitHub changes the default again later.
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      - name: Build unsigned .app for a real device
        # `set -o pipefail` is the important bit: piping through `tee` alone would otherwise
        # make this step's exit code always be tee's (0), silently turning a real build
        # failure into a "green" step. With pipefail, the step still fails exactly when
        # xcodebuild does — `tee` only *additionally* saves everything to build.log so the
        # very last lines are never lost.
        #
        # NSUnbufferedIO=YES is Apple's own convention (honoured by xcodebuild, clang, ld and
        # most other Xcode toolchain binaries) for forcing line-buffered stdout/stderr even
        # when the process is writing into a pipe. Previously this step tried to use `stdbuf`
        # for the same purpose, but `stdbuf` is a GNU coreutils tool and simply does not exist
        # on macOS runners — the shell failed with "stdbuf: command not found" (exit code 127)
        # before xcodebuild ever got a chance to run. NSUnbufferedIO is the macOS-native,
        # no-extra-packages equivalent: nothing to install, nothing to break on a future runner
        # image update. Without SOME form of unbuffering, xcodebuild's output through `tee` can
        # end mid-line (e.g. right after actool starts) with the actual Swift compiler errors
        # still sitting in the process's stdio buffer at the moment it exits.
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail
          xcodebuild \
            -project ArenaMobile.xcodeproj \
            -scheme ArenaMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log

      - name: Show the actual error on failure
        if: failure()
        run: |
          echo "===== last 150 lines of build.log ====="
          tail -n 150 build.log
          echo ""
          echo "===== all lines mentioning error/failed/undefined/ld: ====="
          grep -n -i -E "error:|failed|undefined symbol|ld: |clang: error|linker command failed" build.log || echo "(no matching lines found — see the full build.log artifact uploaded below)"

      - name: Extract Swift compiler errors with context
        # Этот шаг — специально для случая, когда вывод xcodebuild обрывается на actool/clang и
        # реальные ошибки Swift-компиляции не попадают в UI Actions. `grep -B5 -A5 "error:"`
        # печатает каждую строку с "error:" плюс 5 строк до и 5 после — этого обычно достаточно,
        # чтобы увидеть полный контекст: имя файла, номер строки, суть ошибки и подсказку
        # компилятора. Если build.log пуст или ошибок не найдено, выводим явное сообщение —
        # чтобы этот шаг сам по себе не выглядел как "ещё одна непонятная ошибка".
        if: failure()
        run: |
          echo "===== Swift/clang errors with 5 lines of context ====="
          if [ ! -s build.log ]; then
            echo "build.log пуст — xcodebuild упал до начала записи вывода."
            echo "Это значит, что проблема в самом вызове xcodebuild, а не в Swift-коде."
            exit 0
          fi
          grep -n -B5 -A5 "error:" build.log || echo "(в build.log нет строк со словом 'error:' — пришлите артефакт целиком)"

      - name: Upload full build log (always, even on success)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArenaMobile-build-log
          path: build.log
          retention-days: 14

      - name: Package into an (unsigned) .ipa
        # Этот шаг запускается только если предыдущий (Build) прошёл успешно — иначе
        # build/Build/Products/Release-iphoneos/ArenaMobile.app просто не существует,
        # и cp упадёт с невнятным "No such file or directory" вместо понятной ошибки
        # сборки. `if: success()` уточняет поведение: артефакт .ipa не собираем, если
        # компиляция провалилась.
        if: success()
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/ArenaMobile.app" Payload/
          zip -r ArenaMobile-unsigned.ipa Payload

      - name: Upload .ipa as a build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ArenaMobile-unsigned-ipa
          path: ArenaMobile-unsigned.ipa
          retention-days: 14